name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Run Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm test --run

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  calendar-ui:
    name: Calendar UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check calendar interface with fictional data
        run: pnpm test:calendar:ui

  # Authenticated mutation tests use an ephemeral local database, without production secrets.
  local-critical-flows:
    name: Local Critical Flows
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated Supabase
        run: pnpm exec supabase start --exclude studio,imgproxy,logflare,vector,supavisor,edge-runtime > /dev/null
      - name: Back up isolated Supabase before mutating tests
        id: local-backup
        run: |
          set -euo pipefail
          backup_dir=$(mktemp -d "$RUNNER_TEMP/emb-supabase-backup.XXXXXX")
          chmod 700 "$backup_dir"
          umask 077
          # This newly created CI instance has no Storage files to export.
          test "$(docker exec supabase_db_emb-app psql --username=postgres --dbname=postgres --tuples-only --no-align --command='SELECT count(*) FROM storage.objects')" = "0"
          docker exec supabase_db_emb-app pg_dump --username=postgres --dbname=postgres --format=custom > "$backup_dir/database.dump"
          docker exec supabase_db_emb-app pg_dumpall --username=postgres --roles-only --no-role-passwords > "$backup_dir/roles.sql"
          docker exec -i supabase_db_emb-app pg_restore --list < "$backup_dir/database.dump" > "$backup_dir/archive.list"
          test -s "$backup_dir/archive.list"
          docker exec -i supabase_db_emb-app pg_restore --file=/dev/null < "$backup_dir/database.dump"
          sha256sum "$backup_dir/database.dump" "$backup_dir/roles.sql" > "$backup_dir/checksums.sha256"
          sha256sum --check "$backup_dir/checksums.sha256" > /dev/null
          # Auth hashes stay private on the disposable runner; never upload this backup.
          echo 'Isolated Supabase backup verified before invitation/logout/vacation tests.'
      - name: Invitation failure, recovery and acceptance
        run: pnpm test:invitation:e2e:local
      - name: Logout and session isolation
        run: pnpm test:logout:local
      - name: Vacation pagination, permissions and error recovery
        run: pnpm test:vacations:local
      - name: Mobile dashboard approval flows
        run: pnpm test:dashboard:local
      - name: Stop isolated Supabase
        if: always() && steps.local-backup.outcome == 'success'
        run: pnpm exec supabase stop --no-backup > /dev/null

  # Anonymous smoke/auth tests use the local Next.js webServer after a main push.
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E Tests (Shard ${{ matrix.shard }})
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          pnpm exec playwright test \
            --project=unauthenticated \
            --shard=${{ matrix.shard }}/4

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Job 3: Comment PR with Results
  comment-pr:
    name: Comment PR with Test Results
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests, local-critical-flows]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const unitTestsStatus = '${{ needs.unit-tests.result }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const e2eTestsStatus = '${{ needs.e2e-tests.result }}' === 'success' ? '✅ Passed' : '⏭️ Skipped (PR only)';
            const localFlowsStatus = '${{ needs.local-critical-flows.result }}' === 'success' ? '✅ Passed' : '❌ Failed or skipped';

            const comment = `## 🧪 Test Results

            ### Unit Tests
            ${unitTestsStatus}

            ### Authenticated local flows
            ${localFlowsStatus}

            ### E2E Tests
            ${e2eTestsStatus}
            > Anonymous tests run against the local Next.js server on main pushes. Authenticated flows run against ephemeral local Supabase on PRs and main pushes.

            **Commit**: ${{ github.sha }}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
